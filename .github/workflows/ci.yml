name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check tracked Python and JSON syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import pathlib
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0")
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if path.suffix == ".py":
                  ast.parse(path.read_text(encoding="utf-8"), filename=name)
              elif path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Smoke test offline CLI usage
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/manager.py"],
              capture_output=True, text=True, timeout=10,
          )
          if result.returncode != 1 or not result.stdout.startswith("Usage:") or result.stderr:
              raise SystemExit(f"CLI usage failed: {result.returncode}\n{result.stdout}\n{result.stderr}")
          print(result.stdout, end="")
          PY
